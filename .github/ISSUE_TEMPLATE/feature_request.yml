name: Feature request
description: Define a problem, desired behavior and completion checks.
title: "[Feature]: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Check [PRODUCT.md](https://github.com/collection-of-things/aggregate-mail/blob/main/PRODUCT.md) for project scope.
        Remove private mail and credentials. Report vulnerabilities through
        [SECURITY.md](https://github.com/collection-of-things/aggregate-mail/blob/main/SECURITY.md).
        Write Unknown for details you cannot establish.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what prevents it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired result
      description: Describe the behavior you want. An implementation plan is not required.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Give a concrete input, action and expected output using synthetic data.
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Name the affected workflow and behavior that must stay unchanged. File paths are optional; write Unknown if needed.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that would make this request complete.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Verification plan
      description: Name checks or manual steps to run. Write Unknown if the checks need investigation; do not claim planned checks passed.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe a current workaround or another approach you considered.
    validations:
      required: false
  - type: textarea
    id: related-work
    attributes:
      label: Related work
      description: Link relevant issues, PRs and dependencies, or state what you searched.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed mail content, addresses, account names, credentials and local paths from this request.
          required: true
        - label: This is not a security vulnerability. I will report those privately instead.
          required: true
