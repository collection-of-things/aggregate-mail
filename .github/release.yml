# Groups the notes GitHub generates for each release.
changelog:
  exclude:
    authors:
      - dependabot
  categories:
    - title: Features
      labels: [feature, enhancement]
    - title: Fixes
      labels: [bug]
    - title: Accessibility
      labels: [accessibility]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
