name: Dependency review

# Fails a pull request that adds a dependency with a known high or critical
# vulnerability, or a license that cannot ship in an MIT application.
on: pull_request

permissions:
  contents: read

jobs:
  review:
    name: Dependency review
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
